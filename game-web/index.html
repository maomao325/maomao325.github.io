<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>笨米先飞</title>
    <style>
        /* 去除网页所有的默认边距，背景设为黑色 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        /* 让游戏画面（画布）占满整个屏幕，不留边框 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- 这是游戏画面，去掉所有的 div 和默认图案 -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <!-- 引入 love.js 引擎 -->
    <script src="love.js"></script>

    <script>
        // 这是 love.js 的核心启动逻辑
        // 让画布自适应屏幕大小，防止游戏被挤压或拉伸
        var canvas = document.getElementById("canvas");
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 保留原先启动游戏数据的配置（注意：这里的 game.data 是你的游戏包名，如果你改过名字，请修改这里）
        var Module = {
            canvas: canvas,
            arguments: ['game.data'] // 如果原本这里不是 game.data，请替换为你原本的文件名
        };
    </script>
    
    <!-- 如果 love.js 还需要加载其他启动脚本，请确保它们在这里引入 -->
</body>
</html>

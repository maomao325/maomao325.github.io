<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>笨米先飞</title>
    <style>
        /* 强制去除所有边距，背景变黑，防止出现滚动条 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        /* 让游戏画布铺满整个屏幕 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- 游戏只会渲染在这个画布里 -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <!-- 引入 love.js 引擎 -->
    <script src="love.js"></script>

    <!-- 启动逻辑 -->
    <script>
        // 保持你原本代码里的 Module 配置（如果原本有的话，原样贴在这里）
        var Module = {
            canvas: document.getElementById("canvas"),
            arguments: [],
        };

        // 游戏加载完成后，强制全屏并调整画布大小
        window.onload = function() {
            // 监听窗口大小变化，让画布自适应屏幕
            window.addEventListener('resize', function() {
                var canvas = document.getElementById("canvas");
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
            // 初始化触发一次
            window.dispatchEvent(new Event('resize'));
        };
    </script>

    <!-- ⚠️ 注意这里：默认加载的游戏数据包 -->
    <!-- 如果你原本代码里，这里写的是 'game.data'，那就保持原样 -->
    <script>
        // 让 love.js 加载游戏数据
        // 这行通常是在 love.js 内部处理的，如果原本模板里有 <script src="game.js"></script>，请保留原本的加载行
    </script>
    
    <!-- 这一行是某些版本 love.js 启动游戏需要的，如果你原本文件有，就加上 -->
    <script>
        // 某些模板会通过这种形式启动，请对照你原本删掉的代码，看看有没有需要保留的
        // 通常 love.js 会自动接管加载。
    </script>
</body>
</html>
